<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>😁 Invisalign Aligner Tracker</title>
<script>
  (function () {
    var saved = localStorage.getItem('invisalignTrackerTheme');
    var dark = saved ? saved === 'dark' : true;
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
<style>
  :root {
    --primary: #2a78d6;
    --primary-dark: #1f5fac;
    --primary-light: #eaf2fc;
    --accent: #1baf7a;
    --accent-dark: #148f60;
    --danger: #e34948;
    --warn: #c97e00;
    --surface: #ffffff;
    --surface-muted: #f6f8fb;
    --border: #e3e7ef;
    --text-primary: #17203a;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --radius: 14px;
    --shadow: 0 2px 4px rgba(23,32,58,.06), 0 12px 28px -6px rgba(23,32,58,.14), 0 28px 56px -20px rgba(23,32,58,.16);
    --shadow-sm: 0 1px 2px rgba(23,32,58,.06), 0 6px 14px -4px rgba(23,32,58,.12);
    --shadow-lift: 0 6px 12px rgba(23,32,58,.08), 0 22px 44px -10px rgba(23,32,58,.22), 0 36px 70px -24px rgba(23,32,58,.22);
  }
  :root[data-theme="dark"] {
    --primary: #5b9ee8;
    --primary-dark: #86b9ee;
    --primary-light: rgba(91,158,232,.18);
    --accent: #33d497;
    --accent-dark: #16a874;
    --danger: #f2726f;
    --warn: #e0a030;
    --surface: #1a2130;
    --surface-muted: #232b3d;
    --border: #313b52;
    --text-primary: #eef1f8;
    --text-secondary: #c3cadb;
    --text-muted: #8792a8;
    --shadow: 0 2px 4px rgba(0,0,0,.5), 0 12px 28px -6px rgba(0,0,0,.5), 0 28px 56px -20px rgba(0,0,0,.55);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.5), 0 6px 14px -4px rgba(0,0,0,.45);
    --shadow-lift: 0 6px 12px rgba(0,0,0,.55), 0 22px 44px -10px rgba(0,0,0,.6), 0 36px 70px -24px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px 10px 32px;
    font-family: "Segoe UI", Roboto, -apple-system, sans-serif;
    background:
      radial-gradient(900px 560px at 8% -6%, rgba(42,120,214,.16), transparent 60%),
      radial-gradient(760px 520px at 100% 8%, rgba(27,175,122,.14), transparent 55%),
      radial-gradient(820px 620px at 30% 115%, rgba(227,73,72,.10), transparent 60%),
      radial-gradient(700px 520px at 92% 100%, rgba(201,126,0,.10), transparent 55%),
      linear-gradient(160deg, #eef1f7, #e4ebf7 60%);
    background-attachment: fixed;
    color: var(--text-primary);
    transition: background-color .2s ease, color .2s ease;
  }
  :root[data-theme="dark"] body {
    background:
      radial-gradient(900px 560px at 8% -6%, rgba(91,158,232,.10), transparent 60%),
      radial-gradient(760px 520px at 100% 8%, rgba(51,212,151,.08), transparent 55%),
      radial-gradient(820px 620px at 30% 115%, rgba(242,114,111,.08), transparent 60%),
      radial-gradient(700px 520px at 92% 100%, rgba(224,160,48,.08), transparent 55%),
      linear-gradient(160deg, #0f1420, #0b0f18 60%);
    background-attachment: fixed;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 {
    text-align: center; font-size: 24px; font-weight: 700; margin: 6px 0 4px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { text-align: center; color: var(--text-secondary); font-size: 13px; margin: 0 0 18px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 18px;
    margin-bottom: 18px;
  }

  .controls {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .field input, .field select {
    padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-muted); color: var(--text-primary); font-size: 14px;
    min-width: 150px;
  }
  .field input[type="number"] { min-width: 90px; }

  .btn {
    padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    box-shadow: var(--shadow-sm);
  }
  .btn.secondary {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  }
  .btn.ghost {
    background: var(--surface-muted); color: var(--text-primary); border: 1px solid var(--border);
    box-shadow: none;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

  #calendarContainer {
    display: flex; flex-direction: column; gap: 6px;
  }
  .set-row { display: flex; gap: 6px; align-items: stretch; }
  .set-row .set-marker { flex: 0 0 72px; }
  .set-days {
    flex: 1; display: flex; flex-wrap: nowrap; gap: 6px; min-width: 0;
  }
  .set-days .day-box { flex: 1 1 0; min-width: 0; }
  .day-box {
    position: relative; border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface-muted); min-height: 54px; padding: 5px 6px;
    display: flex; flex-direction: column; justify-content: flex-start;
  }
  .day-box.empty { background: transparent; border: none; }
  .day-box .date-row { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
  .day-box .date-num { font-size: 10.5px; font-weight: 700; color: var(--text-primary); }
  .day-box .dow-label { font-size: 9.5px; font-weight: 600; color: var(--text-muted); text-transform: capitalize; white-space: normal; word-break: break-word; }
  .day-box .set-label {
    font-size: 11px; color: var(--primary-dark); font-weight: 600; margin-top: 3px; line-height: 1.2;
  }
  .day-box.set-marker { background: var(--primary-light); border-color: var(--primary); border-width: 2px; align-items: center; justify-content: center; }
  .set-marker-label { font-size: 12px; font-weight: 700; color: var(--primary-dark); text-align: center; }
  .day-box.past { opacity: .55; }
  .day-box .worn-check {
    position: absolute; top: 2px; right: 3px; width: 14px; height: 14px; cursor: pointer;
  }
  .day-box [contenteditable="true"] {
    outline: none; cursor: text; min-width: 6px; min-height: 9px;
    border-bottom: 1px dashed var(--text-muted);
  }
  .day-box [contenteditable="true"]:focus { border-bottom: 1px solid var(--primary); background: var(--surface); }
  .day-box.manual { background: var(--surface); }
  .day-box.manual.set-marker { background: var(--primary-light); }

  .theme-toggle {
    position: fixed; top: 12px; right: 12px; z-index: 10;
    background: var(--surface); border: 1px solid var(--border); border-radius: 50%;
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: var(--shadow-sm); font-size: 16px;
  }

  .progress-wrap {
    margin-top: 10px; background: var(--surface-muted); border-radius: 10px; overflow: hidden;
    height: 10px; border: 1px solid var(--border);
  }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; }
  .progress-text { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }

  /* Print / A4 */
  @media print {
    body { background: #fff !important; padding: 0; }
    .theme-toggle, .controls, .btn-row, .no-print { display: none !important; }
    .card { box-shadow: none; border: none; padding: 0; margin: 0; }
    .container { max-width: 100%; }
    @page { size: A4; margin: 10mm 8mm; }
    .set-days { gap: 4px; }
    .set-row { page-break-inside: avoid; break-inside: avoid; }
    .day-box {
      min-height: 44px; padding: 3px 4px;
      break-inside: avoid; page-break-inside: avoid;
    }
    h1 { -webkit-print-color-adjust: exact; print-color-adjust: exact; color: #1f5fac !important; background: none !important; }
    .day-box.set-marker { background: #eaf2fc !important; border-color: #2a78d6 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .day-box.past { opacity: 1; }
    .worn-check { display: none !important; }
    .day-box [contenteditable="true"] { border-bottom: 1px dashed #999 !important; }

    /* Decorative print style — purely cosmetic, no layout/sizing changes */
    body.fancy-print .set-row:nth-child(6n+1) .day-box { background: linear-gradient(145deg, #eaf2fc, #d6e6fa) !important; border-color: #a9c7f0 !important; }
    body.fancy-print .set-row:nth-child(6n+2) .day-box { background: linear-gradient(145deg, #e8f8f0, #cdf0dd) !important; border-color: #9fdfc0 !important; }
    body.fancy-print .set-row:nth-child(6n+3) .day-box { background: linear-gradient(145deg, #fdf2e3, #fae3bc) !important; border-color: #edc980 !important; }
    body.fancy-print .set-row:nth-child(6n+4) .day-box { background: linear-gradient(145deg, #fbe9ea, #f7d2d3) !important; border-color: #eba9ab !important; }
    body.fancy-print .set-row:nth-child(6n+5) .day-box { background: linear-gradient(145deg, #f1ebfb, #e1d2f6) !important; border-color: #c5a3ea !important; }
    body.fancy-print .set-row:nth-child(6n+6) .day-box { background: linear-gradient(145deg, #e7f6fa, #c9edf5) !important; border-color: #93d6ea !important; }

    body.fancy-print .day-box {
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
      box-shadow: 0 1px 3px rgba(23,32,58,.12);
    }
    body.fancy-print .date-num { color: #1f2a44 !important; }
    body.fancy-print .set-row:nth-child(6n+1) .set-label { color: #1f5fac !important; }
    body.fancy-print .set-row:nth-child(6n+2) .set-label { color: #16875c !important; }
    body.fancy-print .set-row:nth-child(6n+3) .set-label { color: #a06c00 !important; }
    body.fancy-print .set-row:nth-child(6n+4) .set-label { color: #b0383a !important; }
    body.fancy-print .set-row:nth-child(6n+5) .set-label { color: #6b3fa6 !important; }
    body.fancy-print .set-row:nth-child(6n+6) .set-label { color: #157a95 !important; }

    body.fancy-print .day-box.set-marker {
      filter: brightness(0.92) saturate(1.15);
      box-shadow: 0 1px 4px rgba(23,32,58,.18);
    }
    body.fancy-print .set-marker-label { font-weight: 800 !important; }
  }
</style>
</head>
<body>
<div class="theme-toggle no-print" id="themeToggle" title="Toggle theme">🌙</div>
<div class="container">
  <h1 class="no-print">Invisalign Aligner Tracker</h1>
  <p class="subtitle no-print">Full day-by-day calendar view of aligner changes, for up to 2 years.</p>

  <div class="card no-print">
    <div class="controls">
      <div class="field">
        <label for="patientName">Name (optional)</label>
        <input type="text" id="patientName" placeholder="e.g. Jane" />
      </div>
      <div class="field">
        <label for="startDate">Set 1 start date</label>
        <input type="date" id="startDate" />
      </div>
      <div class="field">
        <label for="totalSets">Total aligner sets</label>
        <input type="number" id="totalSets" min="1" max="104" value="52" />
      </div>
      <div class="field">
        <label for="wearDays">Days per set</label>
        <input type="number" id="wearDays" min="1" max="30" value="8" />
      </div>
      <div class="field">
        <label for="manualMode">&nbsp;</label>
        <label style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500; color:var(--text-secondary); white-space:nowrap;">
          <input type="checkbox" id="manualMode" style="width:16px;height:16px;" /> Manual entry (blank / editable)
        </label>
      </div>
      <button class="btn" id="generateBtn">Generate Schedule</button>
    </div>
    <div class="btn-row" style="align-items:center;">
      <button class="btn secondary" id="printBtn">🖨️ Print (A4)</button>
      <button class="btn ghost" id="resetBtn">Reset Ticks</button>
      <label style="display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500; color:var(--text-secondary);">
        <input type="checkbox" id="fancyPrint" style="width:16px;height:16px;" /> ✨ Decorative print style
      </label>
    </div>
    <p class="hint no-print" style="font-size:12px; color:var(--text-muted); margin:10px 0 0;">
      Tip: Enable "Manual entry" if your schedule changes — the sheet prints with blank boxes you can fill in by hand, or click a box on screen to type the date/day yourself.
    </p>
  </div>

  <div class="card no-print" id="progressCard" style="display:none;">
    <strong id="progressLabel"></strong>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>

  <div class="card" id="scheduleCard" style="display:none;">
    <div id="printHeader" style="display:none; margin-bottom:10px;">
      <h1 style="font-size:20px;">Invisalign Aligner Tracker</h1>
    </div>
    <div id="calendarContainer"></div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'invisalignSchedule_v1';
  const THEME_KEY = 'invisalignTrackerTheme';

  const themeToggle = document.getElementById('themeToggle');
  function applyThemeIcon() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeToggle.textContent = isDark ? '☀️' : '🌙';
  }
  applyThemeIcon();
  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem(THEME_KEY, 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem(THEME_KEY, 'dark');
    }
    applyThemeIcon();
  });

  const nameInput = document.getElementById('patientName');
  const startDateInput = document.getElementById('startDate');
  const totalSetsInput = document.getElementById('totalSets');
  const wearDaysInput = document.getElementById('wearDays');
  const manualModeInput = document.getElementById('manualMode');
  const generateBtn = document.getElementById('generateBtn');
  const printBtn = document.getElementById('printBtn');
  const fancyPrintInput = document.getElementById('fancyPrint');
  const resetBtn = document.getElementById('resetBtn');
  const scheduleCard = document.getElementById('scheduleCard');
  const calendarContainer = document.getElementById('calendarContainer');
  const printHeader = document.getElementById('printHeader');
  const progressCard = document.getElementById('progressCard');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const progressLabel = document.getElementById('progressLabel');

  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function day2(n) { return String(n).padStart(2,'0'); }

  function fmtDate(d) {
    return `${String(d.getDate()).padStart(2,'0')} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
  }

  function loadState() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    } catch (e) { return null; }
  }
  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function todayMidnight() {
    const t = new Date();
    t.setHours(0,0,0,0);
    return t;
  }

  const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function makeField(tag, className, text, manualMode, key, manualText) {
    const el = document.createElement(tag);
    el.className = className;
    if (manualMode) {
      el.contentEditable = 'true';
      el.setAttribute('data-key', key);
      el.textContent = (manualText && manualText[key]) || '';
    } else {
      el.textContent = text;
    }
    return el;
  }

  function buildSchedule(startStr, totalSets, wearDays, name, checks, manualMode, manualText) {
    const [y,m,d] = startStr.split('-').map(Number);
    const start = new Date(y, m-1, d);
    const today = todayMidnight();
    checks = checks || {};
    manualText = manualText || {};

    calendarContainer.innerHTML = '';
    calendarContainer.classList.toggle('manual-mode', !!manualMode);
    let worn = 0;

    for (let i = 0; i < totalSets; i++) {
      const setStartDate = new Date(start);
      setStartDate.setDate(start.getDate() + i * wearDays);

      const setRow = document.createElement('div');
      setRow.className = 'set-row';

      const markerBox = document.createElement('div');
      markerBox.className = 'day-box set-marker' + (manualMode ? ' manual' : '');
      markerBox.appendChild(makeField('div', 'set-marker-label', `Set ${i + 1}`, manualMode, `${i}:0:marker`, manualText));
      setRow.appendChild(markerBox);

      const setDays = document.createElement('div');
      setDays.className = 'set-days';

      const startBox = document.createElement('div');
      startBox.className = 'day-box set-start' + (manualMode ? ' manual' : '');
      if (!manualMode && setStartDate.getTime() === today.getTime()) startBox.classList.add('today');
      if (!manualMode && setStartDate.getTime() < today.getTime()) startBox.classList.add('past');

      startBox.appendChild(makeField('div', 'date-num', `${day2(setStartDate.getDate())} ${MONTH_NAMES[setStartDate.getMonth()]} (${i * wearDays + 1})`, manualMode, `${i}:1:date`, manualText));
      startBox.appendChild(makeField('div', 'dow-label', DAY_NAMES[setStartDate.getDay()], manualMode, `${i}:1:dow`, manualText));
      startBox.appendChild(makeField('div', 'set-label', `Set ${i + 1} Day 1`, manualMode, `${i}:1:label`, manualText));

      if (checks[i]) worn++;
      setDays.appendChild(startBox);

      for (let dd = 1; dd < wearDays; dd++) {
        const dt = new Date(start);
        dt.setDate(start.getDate() + i * wearDays + dd);

        const box = document.createElement('div');
        box.className = 'day-box' + (manualMode ? ' manual' : '');

        if (!manualMode && dt.getTime() === today.getTime()) box.classList.add('today');
        if (!manualMode && dt.getTime() < today.getTime()) box.classList.add('past');

        box.appendChild(makeField('div', 'date-num', `${day2(dt.getDate())} ${MONTH_NAMES[dt.getMonth()]} (${i * wearDays + dd + 1})`, manualMode, `${i}:${dd+1}:date`, manualText));
        box.appendChild(makeField('div', 'dow-label', DAY_NAMES[dt.getDay()], manualMode, `${i}:${dd+1}:dow`, manualText));
        box.appendChild(makeField('div', 'set-label', `Set ${i + 1} Day ${dd + 1}`, manualMode, `${i}:${dd+1}:label`, manualText));

        setDays.appendChild(box);
      }

      setRow.appendChild(setDays);
      calendarContainer.appendChild(setRow);
    }

    progressCard.style.display = 'block';
    scheduleCard.style.display = 'block';
    printHeader.style.display = 'block';
    updateProgress(worn, totalSets);
  }

  function updateProgress(worn, total) {
    const pct = total ? Math.round((worn/total)*100) : 0;
    progressBar.style.width = pct + '%';
    progressLabel.textContent = 'Progress';
    progressText.textContent = `${worn} of ${total} sets worn (${pct}%)`;
  }

  function currentInputs() {
    return {
      name: nameInput.value.trim(),
      start: startDateInput.value,
      totalSets: Math.max(1, Math.min(104, parseInt(totalSetsInput.value,10) || 52)),
      wearDays: Math.max(1, Math.min(30, parseInt(wearDaysInput.value,10) || 8)),
      manualMode: manualModeInput.checked,
    };
  }

  generateBtn.addEventListener('click', () => {
    const inp = currentInputs();
    if (!inp.start) { alert('Please choose the start date for Set 1.'); return; }
    const prev = loadState();
    const state = { ...inp, checks: {}, manualText: (prev && prev.manualText) || {} };
    saveState(state);
    buildSchedule(inp.start, inp.totalSets, inp.wearDays, inp.name, state.checks, inp.manualMode, state.manualText);
  });

  calendarContainer.addEventListener('change', (e) => {
    if (e.target.matches('input.worn-check')) {
      const idx = e.target.getAttribute('data-idx');
      const state = loadState() || {};
      state.checks = state.checks || {};
      state.checks[idx] = e.target.checked;
      saveState(state);
      const total = parseInt(totalSetsInput.value,10) || 1;
      const worn = Object.values(state.checks).filter(Boolean).length;
      updateProgress(worn, total);
    }
  });

  calendarContainer.addEventListener('blur', (e) => {
    if (e.target.matches('[contenteditable="true"]')) {
      const key = e.target.getAttribute('data-key');
      const state = loadState() || {};
      state.manualText = state.manualText || {};
      state.manualText[key] = e.target.textContent;
      saveState(state);
    }
  }, true);

  printBtn.addEventListener('click', () => {
    document.body.classList.toggle('fancy-print', fancyPrintInput.checked);
    localStorage.setItem('invisalignFancyPrint', fancyPrintInput.checked ? '1' : '0');
    window.print();
  });

  fancyPrintInput.checked = localStorage.getItem('invisalignFancyPrint') === '1';

  resetBtn.addEventListener('click', () => {
    if (!confirm('Clear all "worn" check marks?')) return;
    const state = loadState();
    if (state) { state.checks = {}; saveState(state); }
    const inp = currentInputs();
    if (inp.start) buildSchedule(inp.start, inp.totalSets, inp.wearDays, inp.name, {}, inp.manualMode, state && state.manualText);
  });

  (function init() {
    const state = loadState();
    if (state && state.start) {
      nameInput.value = state.name || '';
      startDateInput.value = state.start;
      totalSetsInput.value = state.totalSets || 52;
      wearDaysInput.value = state.wearDays || 8;
      manualModeInput.checked = !!state.manualMode;
      buildSchedule(state.start, state.totalSets, state.wearDays, state.name, state.checks || {}, state.manualMode, state.manualText);
    } else {
      const d = todayMidnight();
      startDateInput.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
  })();
</script>
</body>
</html>
