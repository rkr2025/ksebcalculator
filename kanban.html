<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🗂️ Simple Kanban Task Board</title>
<style>
  :root {
    --primary: #2a78d6;
    --primary-dark: #1f5fac;
    --primary-light: #eaf2fc;
    --accent: #1baf7a;
    --accent-dark: #148f60;
    --danger: #e34948;
    --warn: #c97e00;
    --surface: #ffffff;
    --surface-muted: #f6f8fb;
    --border: #e3e7ef;
    --text-primary: #17203a;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --radius: 14px;
    --shadow: 0 2px 4px rgba(23,32,58,.06), 0 12px 28px -6px rgba(23,32,58,.14), 0 28px 56px -20px rgba(23,32,58,.16);
    --shadow-sm: 0 1px 2px rgba(23,32,58,.06), 0 6px 14px -4px rgba(23,32,58,.12);
    --shadow-lift: 0 6px 12px rgba(23,32,58,.08), 0 22px 44px -10px rgba(23,32,58,.22), 0 36px 70px -24px rgba(23,32,58,.22);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px 10px 32px;
    font-family: "Segoe UI", Roboto, -apple-system, sans-serif;
    background:
      radial-gradient(900px 560px at 8% -6%, rgba(42,120,214,.16), transparent 60%),
      radial-gradient(760px 520px at 100% 8%, rgba(27,175,122,.14), transparent 55%),
      radial-gradient(820px 620px at 30% 115%, rgba(227,73,72,.10), transparent 60%),
      radial-gradient(700px 520px at 92% 100%, rgba(201,126,0,.10), transparent 55%),
      linear-gradient(160deg, #eef1f7, #e4ebf7 60%);
    background-attachment: fixed;
    color: var(--text-primary);
  }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 {
    text-align: center; font-size: 24px; font-weight: 700; margin: 6px 0 4px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 3px rgba(23,32,58,.15));
  }
  .subtitle { text-align: center; color: var(--text-muted); font-size: 13px; margin: 0 0 18px; }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.82));
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.6);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    margin-bottom: 16px;
  }

  button {
    position: relative;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    overflow: hidden;
    transition: filter .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  button::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 55%);
    pointer-events: none;
  }
  button:hover { filter: brightness(0.97); transform: translateY(-1px); }
  button:active { transform: translateY(1px); filter: brightness(0.93); }
  .btn-add {
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #fff;
    box-shadow: 0 2px 3px rgba(27,175,122,.25), 0 10px 22px -4px rgba(27,175,122,.5);
  }
  .btn-add:hover { box-shadow: 0 4px 8px rgba(27,175,122,.3), 0 16px 30px -6px rgba(27,175,122,.55); }
  .btn-outline {
    background: linear-gradient(180deg, #ffffff, var(--surface-muted));
    color: var(--text-secondary);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .btn-outline:hover { box-shadow: var(--shadow-lift); }
  .btn-small { padding: 6px 10px; font-size: 12.5px; white-space: nowrap; }
  .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13.5px; padding: 3px 6px; box-shadow: none; }
  .icon-btn:hover { color: var(--primary); filter: none; transform: none; }
  .icon-btn.danger:hover { color: var(--danger); }

  input {
    font-family: inherit;
    font-size: 13.5px;
    padding: 8px 9px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-primary);
    box-shadow: inset 0 1px 3px rgba(23,32,58,.05);
    transition: border-color .15s ease, box-shadow .15s ease;
    width: 100%;
  }
  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light), inset 0 1px 3px rgba(23,32,58,.05);
  }

  .card-form-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .actions-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .empty-note { color: var(--text-muted); font-style: italic; font-size: 12.5px; padding: 6px 4px; text-align: center; }

  /* -------- Board -------- */
  .kanban-board { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; padding-bottom: 12px; }

  .kanban-column {
    flex: 0 0 270px; width: 270px;
    background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.82));
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.6);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    max-height: 76vh;
  }
  .kanban-column-header { display: flex; align-items: center; gap: 6px; padding: 12px 10px 8px 14px; }
  .kanban-column-title {
    font-size: 14px; font-weight: 700; flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: text; padding: 3px 5px; border-radius: 6px;
  }
  .kanban-column-title:hover { background: var(--surface-muted); }
  .kanban-rename-input { font-size: 14px; font-weight: 700; padding: 5px 6px; flex: 1 1 auto; min-width: 0; }
  .kanban-column-count { font-size: 10.5px; font-weight: 700; color: var(--text-muted); background: var(--surface-muted); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }

  .kanban-column-body {
    flex: 1 1 auto; overflow-y: auto; min-height: 60px;
    padding: 4px 10px 8px 14px; display: flex; flex-direction: column; gap: 8px;
    border-radius: 8px; transition: background-color .15s ease;
  }
  .kanban-column-body.drag-over { background: var(--primary-light); }

  .add-task-btn-row, .add-task-form { padding: 4px 10px 12px 14px; }
  .add-task-btn {
    width: 100%; background: none; border: 1.5px dashed var(--border); color: var(--text-muted);
    box-shadow: none; font-size: 12.5px; padding: 8px; border-radius: 8px;
  }
  .add-task-btn:hover { border-color: var(--primary); color: var(--primary); filter: none; transform: none; }

  .task-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; box-shadow: var(--shadow-sm); cursor: grab;
  }
  .task-card:active { cursor: grabbing; }
  .task-card.dragging { opacity: .4; }
  .task-card-title { font-size: 13px; font-weight: 600; color: var(--text-primary); word-break: break-word; }
  .task-card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .tag-chip { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .task-card-actions { display: flex; justify-content: flex-end; gap: 0; margin-top: 4px; }

  .kanban-add-column { flex: 0 0 230px; width: 230px; }
  .add-column-btn {
    width: 100%; height: 48px; border: 1.5px dashed rgba(23,32,58,.18); border-radius: var(--radius);
    background: rgba(255,255,255,.35); color: var(--text-muted); font-size: 13px; box-shadow: none;
  }
  .add-column-btn:hover { border-color: var(--primary); color: var(--primary); filter: none; transform: none; }
  .add-column-form {
    background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.82));
    border: 1px solid rgba(255,255,255,.6); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px;
  }

  .move-menu {
    position: absolute; display: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow-lift); z-index: 60; overflow: hidden; min-width: 150px;
  }
  .move-menu.show { display: block; }
  .move-menu-item {
    display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 0;
    box-shadow: none; padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: var(--text-primary);
  }
  .move-menu-item:not(:last-child) { border-bottom: 1px solid var(--border); }
  .move-menu-item:hover { background: var(--primary-light); filter: none; transform: none; }
  .move-menu-item:disabled { color: var(--text-muted); cursor: default; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: linear-gradient(180deg, #26314f, #17203a); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow-lift);
    opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 70;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--danger); }

  .nav-link { display: block; text-align: center; margin-top: 8px; text-decoration: none; color: var(--primary); font-size: 13.5px; }

  @media (max-width: 480px) {
    body { padding: 10px 6px 24px; }
    h1 { font-size: 20px; }
    .kanban-column, .kanban-add-column { flex-basis: 240px; width: 240px; }
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none !important; transform: none !important; }
  }
</style>

<body>
  <div class="container">
    <h1>🗂️ Simple Kanban Task Board</h1>
    <p class="subtitle">A minimalist drag-and-drop board for personal goals and projects -- everything stays saved in this browser.</p>

    <div class="kanban-board" id="kanbanBoard"></div>

    <div class="card">
      <div class="actions-row">
        <button class="btn-outline" id="backupBoardBtn" type="button">💾 Backup</button>
        <button class="btn-outline" id="restoreBoardBtn" type="button">📂 Restore</button>
        <input type="file" id="restoreFileInput" accept=".json" style="display:none;">
        <button class="btn-outline" id="clearBoardBtn" type="button">🗑️ Clear Board</button>
      </div>
    </div>

    <a href="tools.html" class="nav-link">← Back to Tools</a>
    <div class="view-counter" style="text-align: center; margin-top: 10px;">
      <img src="https://hits.sh/rkr2025.github.io/ksebcalculator/kanban.svg?style=flat-square&label=Views" alt="No. of views" loading="lazy">
    </div>
  </div>

  <div class="move-menu" id="moveMenu"></div>
  <div class="toast" id="toast"></div>

  <script>
    // ------------------------------ Shared helpers -----------------------------
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
    function dateKey(d) {
      const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    const toast = document.getElementById('toast');
    function showToast(message, isError) {
      toast.textContent = message;
      toast.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { toast.className = 'toast'; }, 2600);
    }

    // ------------------------------ Tag colors ----------------------------------
    const TAG_COLORS = [
      { bg: 'rgba(42,120,214,.15)', text: '#1f5fac' },
      { bg: 'rgba(27,175,122,.15)', text: '#148f60' },
      { bg: 'rgba(227,73,72,.15)', text: '#c93f3e' },
      { bg: 'rgba(201,126,0,.15)', text: '#c97e00' },
      { bg: 'rgba(155,89,214,.15)', text: '#7d3fc9' },
      { bg: 'rgba(0,172,193,.15)', text: '#0b8a9a' },
      { bg: 'rgba(214,89,171,.15)', text: '#b23f8f' },
      { bg: 'rgba(100,116,139,.15)', text: '#52616f' },
    ];
    // Deterministic so the same tag text always renders the same color,
    // without needing to persist a separate tag-to-color mapping.
    function tagColor(tag) {
      let hash = 0;
      for (let i = 0; i < tag.length; i++) hash = (hash * 31 + tag.charCodeAt(i)) >>> 0;
      return TAG_COLORS[hash % TAG_COLORS.length];
    }

    // ------------------------------ State & storage -----------------------------
    const KANBAN_KEY = 'kanbanBoard';
    let columns = [];
    let nextColumnId = 1;
    let nextTaskId = 1;

    let editingColumnId = null;
    let addingTaskColumnId = null;
    let editingTaskId = null;
    let addingColumn = false;

    function seedDefaultBoard() {
      nextColumnId = 1;
      nextTaskId = 1;
      columns = [
        { id: nextColumnId++, title: 'To Do', tasks: [{ id: nextTaskId++, title: 'Welcome! Click "+ Add Task" to create your first card.', tag: 'tip' }] },
        { id: nextColumnId++, title: 'In Progress', tasks: [] },
        { id: nextColumnId++, title: 'Done', tasks: [] },
      ];
    }

    function loadBoard() {
      try {
        const stored = JSON.parse(localStorage.getItem(KANBAN_KEY));
        if (Array.isArray(stored) && stored.length) {
          columns = stored.map((c) => ({
            id: Number(c.id) || 0,
            title: String(c.title || 'Untitled'),
            tasks: Array.isArray(c.tasks) ? c.tasks.map((t) => ({ id: Number(t.id) || 0, title: String(t.title || ''), tag: String(t.tag || '') })) : [],
          }));
          nextColumnId = Math.max(0, ...columns.map((c) => c.id)) + 1;
          nextTaskId = Math.max(0, ...columns.flatMap((c) => c.tasks.map((t) => t.id))) + 1;
          return;
        }
      } catch { /* fall through to default */ }
      seedDefaultBoard();
    }
    function saveBoard() { localStorage.setItem(KANBAN_KEY, JSON.stringify(columns)); }

    // ------------------------------ Rendering -----------------------------------
    const boardEl = document.getElementById('kanbanBoard');

    function renderBoard() {
      boardEl.innerHTML = columns.map(renderColumn).join('') + renderAddColumnCard();
    }

    function renderColumn(col) {
      const isRenaming = editingColumnId === col.id;
      const isAddingTask = addingTaskColumnId === col.id;
      return `
        <div class="kanban-column" data-column-id="${col.id}">
          <div class="kanban-column-header">
            ${isRenaming
              ? `<input type="text" class="kanban-rename-input" data-column-id="${col.id}" value="${escapeHtml(col.title)}">`
              : `<div class="kanban-column-title" data-action="rename-column" data-column-id="${col.id}" title="Click to rename">${escapeHtml(col.title)}</div>`}
            <span class="kanban-column-count">${col.tasks.length}</span>
            <button type="button" class="icon-btn danger" data-action="delete-column" data-column-id="${col.id}" title="Delete column">🗑️</button>
          </div>
          <div class="kanban-column-body" data-column-id="${col.id}">
            ${col.tasks.map((t) => renderTaskCard(col, t)).join('')}
          </div>
          <div class="add-task-btn-row">
            ${isAddingTask ? renderAddTaskForm(col.id) : `<button type="button" class="btn-outline add-task-btn" data-action="show-add-task" data-column-id="${col.id}">➕ Add Task</button>`}
          </div>
        </div>`;
    }

    function renderTaskCard(col, t) {
      if (editingTaskId === t.id) {
        return `
          <div class="task-card" data-task-id="${t.id}" data-column-id="${col.id}">
            <input type="text" class="task-edit-title" data-task-id="${t.id}" value="${escapeHtml(t.title)}" placeholder="Task title">
            <input type="text" class="task-edit-tag" data-task-id="${t.id}" value="${escapeHtml(t.tag || '')}" placeholder="Tag (optional)" style="margin-top:6px;">
            <div class="card-form-actions" style="margin-top:8px;">
              <button type="button" class="btn-outline btn-small" data-action="cancel-edit-task">Cancel</button>
              <button type="button" class="btn-add btn-small" data-action="save-edit-task" data-task-id="${t.id}">💾 Save</button>
            </div>
          </div>`;
      }
      let tagHtml = '';
      if (t.tag) {
        const c = tagColor(t.tag);
        tagHtml = `<div class="task-card-tags"><span class="tag-chip" style="background:${c.bg};color:${c.text};">${escapeHtml(t.tag)}</span></div>`;
      }
      return `
        <div class="task-card" draggable="true" data-task-id="${t.id}" data-column-id="${col.id}">
          <div class="task-card-title">${escapeHtml(t.title)}</div>
          ${tagHtml}
          <div class="task-card-actions">
            <button type="button" class="icon-btn" data-action="move-task" data-task-id="${t.id}" data-column-id="${col.id}" title="Move to another column">⇄</button>
            <button type="button" class="icon-btn" data-action="edit-task" data-task-id="${t.id}" title="Edit">✎</button>
            <button type="button" class="icon-btn danger" data-action="delete-task" data-task-id="${t.id}" data-column-id="${col.id}" title="Delete">🗑️</button>
          </div>
        </div>`;
    }

    function renderAddTaskForm(columnId) {
      return `
        <div class="add-task-form">
          <input type="text" class="add-task-title" placeholder="Task title" data-column-id="${columnId}">
          <input type="text" class="add-task-tag" placeholder="Tag (optional)" style="margin-top:6px;">
          <div class="card-form-actions" style="margin-top:8px;">
            <button type="button" class="btn-outline btn-small" data-action="cancel-add-task">Cancel</button>
            <button type="button" class="btn-add btn-small" data-action="save-add-task" data-column-id="${columnId}">➕ Add</button>
          </div>
        </div>`;
    }

    function renderAddColumnCard() {
      if (addingColumn) {
        return `
          <div class="kanban-add-column">
            <div class="add-column-form">
              <input type="text" id="newColumnTitleInput" placeholder="Column name">
              <div class="card-form-actions" style="margin-top:10px;">
                <button type="button" class="btn-outline btn-small" data-action="cancel-add-column">Cancel</button>
                <button type="button" class="btn-add btn-small" data-action="save-add-column">➕ Add</button>
              </div>
            </div>
          </div>`;
      }
      return `
        <div class="kanban-add-column">
          <button type="button" class="add-column-btn" data-action="show-add-column">➕ Add Column</button>
        </div>`;
    }

    // ------------------------------ Column actions -------------------------------
    function submitRenameColumn(columnId, value) {
      const col = columns.find((c) => c.id === columnId);
      if (!col) return;
      const title = value.trim();
      if (title) col.title = title;
      editingColumnId = null;
      saveBoard();
      renderBoard();
    }

    function deleteColumn(columnId) {
      const col = columns.find((c) => c.id === columnId);
      if (!col) return;
      if (col.tasks.length > 0 && !confirm(`Delete "${col.title}" and its ${col.tasks.length} task(s)? This cannot be undone.`)) return;
      columns = columns.filter((c) => c.id !== columnId);
      saveBoard();
      renderBoard();
    }

    function submitAddColumn() {
      const input = document.getElementById('newColumnTitleInput');
      const title = input.value.trim();
      if (!title) { showToast('Enter a column name.', true); return; }
      columns.push({ id: nextColumnId++, title, tasks: [] });
      addingColumn = false;
      saveBoard();
      renderBoard();
    }

    // ------------------------------ Task actions ----------------------------------
    function submitAddTask(columnId) {
      const form = boardEl.querySelector(`.kanban-column[data-column-id="${columnId}"] .add-task-form`);
      if (!form) return;
      const title = form.querySelector('.add-task-title').value.trim();
      const tag = form.querySelector('.add-task-tag').value.trim();
      if (!title) { showToast('Enter a task title.', true); return; }
      const col = columns.find((c) => c.id === columnId);
      if (!col) return;
      col.tasks.push({ id: nextTaskId++, title, tag });
      addingTaskColumnId = null;
      saveBoard();
      renderBoard();
    }

    function deleteTask(columnId, taskId) {
      const col = columns.find((c) => c.id === columnId);
      if (!col) return;
      col.tasks = col.tasks.filter((t) => t.id !== taskId);
      if (editingTaskId === taskId) editingTaskId = null;
      saveBoard();
      renderBoard();
    }

    function submitEditTask(taskId) {
      const cardEl = boardEl.querySelector(`.task-card[data-task-id="${taskId}"]`);
      if (!cardEl) return;
      let task = null;
      columns.forEach((c) => { const f = c.tasks.find((t) => t.id === taskId); if (f) task = f; });
      if (!task) return;
      const title = cardEl.querySelector('.task-edit-title').value.trim();
      const tag = cardEl.querySelector('.task-edit-tag').value.trim();
      if (!title) { showToast('Task title cannot be empty.', true); return; }
      task.title = title;
      task.tag = tag;
      editingTaskId = null;
      saveBoard();
      renderBoard();
    }

    // Shared by both drag-and-drop and the "Move to..." menu (the touch-friendly
    // fallback, since native HTML5 drag-and-drop is unreliable on mobile browsers).
    function moveTask(fromColumnId, taskId, toColumnId, index) {
      const fromCol = columns.find((c) => c.id === fromColumnId);
      const toCol = columns.find((c) => c.id === toColumnId);
      if (!fromCol || !toCol) return;
      const taskIdx = fromCol.tasks.findIndex((t) => t.id === taskId);
      if (taskIdx === -1) return;
      const [task] = fromCol.tasks.splice(taskIdx, 1);
      let insertAt = index;
      if (fromCol === toCol && taskIdx < insertAt) insertAt -= 1;
      toCol.tasks.splice(Math.max(0, Math.min(insertAt, toCol.tasks.length)), 0, task);
      saveBoard();
      renderBoard();
    }

    // ------------------------------ Move-to menu ----------------------------------
    const moveMenu = document.getElementById('moveMenu');

    function openMoveMenu(taskId, fromColumnId, btnEl) {
      const rect = btnEl.getBoundingClientRect();
      const others = columns.filter((c) => c.id !== fromColumnId);
      moveMenu.innerHTML = others.length
        ? others.map((c) => `<button type="button" class="move-menu-item" data-target="${c.id}">➡ ${escapeHtml(c.title)}</button>`).join('')
        : '<button type="button" class="move-menu-item" disabled>No other columns</button>';
      moveMenu.style.top = `${window.scrollY + rect.bottom + 4}px`;
      moveMenu.style.left = `${window.scrollX + rect.left}px`;
      moveMenu.dataset.taskId = String(taskId);
      moveMenu.dataset.fromColumnId = String(fromColumnId);
      moveMenu.classList.add('show');
    }

    moveMenu.addEventListener('click', (e) => {
      const btn = e.target.closest('.move-menu-item[data-target]');
      if (!btn) return;
      moveTask(Number(moveMenu.dataset.fromColumnId), Number(moveMenu.dataset.taskId), Number(btn.dataset.target), Infinity);
      moveMenu.classList.remove('show');
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.move-menu') && !e.target.closest('[data-action="move-task"]')) {
        moveMenu.classList.remove('show');
      }
    });

    // ------------------------------ Click / keydown delegation --------------------
    boardEl.addEventListener('click', (e) => {
      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      const columnId = Number(actionEl.dataset.columnId);
      const taskId = Number(actionEl.dataset.taskId);

      if (action === 'rename-column') {
        editingColumnId = columnId;
        renderBoard();
        const el = boardEl.querySelector(`.kanban-rename-input[data-column-id="${columnId}"]`);
        if (el) { el.focus(); el.select(); }
      } else if (action === 'delete-column') {
        deleteColumn(columnId);
      } else if (action === 'show-add-task') {
        addingTaskColumnId = columnId;
        renderBoard();
        const el = boardEl.querySelector(`.kanban-column[data-column-id="${columnId}"] .add-task-title`);
        if (el) el.focus();
      } else if (action === 'cancel-add-task') {
        addingTaskColumnId = null;
        renderBoard();
      } else if (action === 'save-add-task') {
        submitAddTask(columnId);
      } else if (action === 'edit-task') {
        editingTaskId = taskId;
        renderBoard();
        const el = boardEl.querySelector(`.task-edit-title[data-task-id="${taskId}"]`);
        if (el) { el.focus(); el.select(); }
      } else if (action === 'cancel-edit-task') {
        editingTaskId = null;
        renderBoard();
      } else if (action === 'save-edit-task') {
        submitEditTask(taskId);
      } else if (action === 'delete-task') {
        deleteTask(columnId, taskId);
      } else if (action === 'move-task') {
        openMoveMenu(taskId, columnId, actionEl);
      } else if (action === 'show-add-column') {
        addingColumn = true;
        renderBoard();
        const el = document.getElementById('newColumnTitleInput');
        if (el) el.focus();
      } else if (action === 'cancel-add-column') {
        addingColumn = false;
        renderBoard();
      } else if (action === 'save-add-column') {
        submitAddColumn();
      }
    });

    boardEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (e.target.classList.contains('kanban-rename-input')) { e.preventDefault(); submitRenameColumn(Number(e.target.dataset.columnId), e.target.value); }
        else if (e.target.classList.contains('add-task-title') || e.target.classList.contains('add-task-tag')) { e.preventDefault(); submitAddTask(Number(e.target.closest('.kanban-column').dataset.columnId)); }
        else if (e.target.id === 'newColumnTitleInput') { e.preventDefault(); submitAddColumn(); }
        else if (e.target.classList.contains('task-edit-title') || e.target.classList.contains('task-edit-tag')) { e.preventDefault(); submitEditTask(Number(e.target.dataset.taskId)); }
      } else if (e.key === 'Escape') {
        if (e.target.classList.contains('kanban-rename-input')) { editingColumnId = null; renderBoard(); }
        else if (e.target.classList.contains('add-task-title') || e.target.classList.contains('add-task-tag')) { addingTaskColumnId = null; renderBoard(); }
        else if (e.target.id === 'newColumnTitleInput') { addingColumn = false; renderBoard(); }
        else if (e.target.classList.contains('task-edit-title') || e.target.classList.contains('task-edit-tag')) { editingTaskId = null; renderBoard(); }
      }
    });

    // ------------------------------ Drag & drop -----------------------------------
    let draggingTaskId = null;
    let draggingFromColumnId = null;

    boardEl.addEventListener('dragstart', (e) => {
      const card = e.target.closest('.task-card[draggable="true"]');
      if (!card) return;
      draggingTaskId = Number(card.dataset.taskId);
      draggingFromColumnId = Number(card.dataset.columnId);
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(draggingTaskId));
    });

    boardEl.addEventListener('dragend', (e) => {
      const card = e.target.closest('.task-card');
      if (card) card.classList.remove('dragging');
      boardEl.querySelectorAll('.kanban-column-body.drag-over').forEach((el) => el.classList.remove('drag-over'));
      draggingTaskId = null;
      draggingFromColumnId = null;
    });

    boardEl.addEventListener('dragover', (e) => {
      const body = e.target.closest('.kanban-column-body');
      if (!body || draggingTaskId === null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      body.classList.add('drag-over');
    });

    boardEl.addEventListener('dragleave', (e) => {
      const body = e.target.closest('.kanban-column-body');
      if (body && !body.contains(e.relatedTarget)) body.classList.remove('drag-over');
    });

    boardEl.addEventListener('drop', (e) => {
      const body = e.target.closest('.kanban-column-body');
      if (!body || draggingTaskId === null) return;
      e.preventDefault();
      body.classList.remove('drag-over');
      const targetColumnId = Number(body.dataset.columnId);
      const insertIndex = computeInsertIndex(body, e.clientY);
      moveTask(draggingFromColumnId, draggingTaskId, targetColumnId, insertIndex);
    });

    function computeInsertIndex(body, clientY) {
      const cards = [...body.querySelectorAll('.task-card:not(.dragging)')];
      for (let i = 0; i < cards.length; i++) {
        const rect = cards[i].getBoundingClientRect();
        if (clientY < rect.top + rect.height / 2) return i;
      }
      return cards.length;
    }

    // ------------------------------ Backup / restore / clear ----------------------
    document.getElementById('backupBoardBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(columns, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `kanban-board-backup-${dateKey(new Date())}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Backed up.');
    });

    const restoreFileInput = document.getElementById('restoreFileInput');
    document.getElementById('restoreBoardBtn').addEventListener('click', () => restoreFileInput.click());
    restoreFileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const restored = JSON.parse(e.target.result);
          if (!Array.isArray(restored)) throw new Error('Invalid backup file.');
          columns = restored.map((c) => ({
            id: nextColumnId++,
            title: String(c.title || 'Untitled'),
            tasks: Array.isArray(c.tasks) ? c.tasks.map((t) => ({ id: nextTaskId++, title: String(t.title || ''), tag: String(t.tag || '') })) : [],
          })).filter((c) => c.title);
          editingColumnId = null;
          editingTaskId = null;
          addingTaskColumnId = null;
          addingColumn = false;
          saveBoard();
          renderBoard();
          showToast('Restored.');
        } catch (err) {
          console.error('Error parsing restore file:', err);
          showToast('Error restoring: invalid JSON file.', true);
        }
      };
      reader.onerror = () => showToast('Error reading file.', true);
      reader.readAsText(file);
      restoreFileInput.value = '';
    });

    document.getElementById('clearBoardBtn').addEventListener('click', () => {
      if (!confirm('Clear the entire board and reset to default columns? This cannot be undone.')) return;
      seedDefaultBoard();
      editingColumnId = null;
      editingTaskId = null;
      addingTaskColumnId = null;
      addingColumn = false;
      saveBoard();
      renderBoard();
      showToast('Board reset.');
    });

    // --------------------------------- Init ---------------------------------
    loadBoard();
    renderBoard();
  </script>
</body>
</html>
